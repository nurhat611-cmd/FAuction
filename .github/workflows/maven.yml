name: Java CI with Maven

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B package --file pom.xml

      # TEMPORARY DIAGNOSTIC (remove): surface the failure through check annotations,
      # the raw log download is unreachable from the dev sandbox.
      - name: Diagnose failure
        if: failure()
        run: |
          {
            echo "--- surefire summaries ---"
            grep -h -E "Tests run:|<<< (FAILURE|ERROR)|Assertion(Op)?Error|expected:|NoSuchElement|NullPointer" target/surefire-reports/*.txt 2>/dev/null | head -25
            echo "--- compile check ---"
            mvn -B test-compile 2>&1 | grep -E "\[ERROR\]|error:" | head -18
          } | head -46 | while IFS= read -r line; do echo "::error::$line"; done
          exit 1

      - name: Upload the plugin JAR
        uses: actions/upload-artifact@v7
        with:
          name: fauction-dev-${{ github.sha }}
          path: target/fauction-*.jar
          if-no-files-found: error
          retention-days: 14

      - name: Upload the test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports-${{ github.sha }}
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  dependency-graph:
    name: Update dependency graph
    # Writes to the repository dependency graph, so it must not run on pull requests.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Submit dependencies
        uses: advanced-security/maven-dependency-submission-action@a64327a7329c9939cf675e458452febe1894a70c