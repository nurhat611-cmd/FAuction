version: 1

# Основные настройки меню
gui:
  size: 54                      # Размер инвентаря (54 слота – 6 рядов)
  type: CHEST                   # Тип контейнера (CHEST)
  name: "Аукцион {Page}/{TotalPage}"  # Заголовок окна
  title: "&eПредмет: &6{ItemName}"    # Заголовок над предметом
  replaceTitle: false           # Заменять ли стандартный заголовок
  hideFlag: false               # Скрывать ли флаги
  description:                  # Описание при наведении на лот - "&dИстекает: &7{ExpireTime}"
    - "&dПродавец: &6{OwnerName}"
    - "&dСтоимость: &e{Price}⛁"
    - "&dОсталось: &7{RemainingTime}"
    - "&dОписание:"
    - "{lore}"

