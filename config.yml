# =====================================================================
# Версия конфигурации. Не меняйте, иначе плагин сбросит настройки.
# =====================================================================
version: 11

# Язык плагина (ru = русский)
lang: ru

# Валюта, используемая в аукционе:
# VAULT    – деньги с плагина Vault (Essentials и т.п.)
# EXPERIENCE – опыт (уровни)
# LEVEL    – уровни (как опыт, но другое API)
currencyUse: VAULT

# Меню, которое открывается по команде /ah (по умолчанию AUCTION)
defaultGui: AUCTION

# ===== Экспериментальные функции =====
feature-flipping:
  item-expiration: true      # Включить автоматическое удаление просроченных лотов
  cache-update: true         # Обновлять кэш данных (для производительности)
  money-format: false        # Красивое форматирование больших чисел (вкл/выкл)
  duplication-hashcode-control: false # Защита от дублирования предметов (хэш-код)

# Формат отображения цен (0,00 = две цифры после запятой, запятая как разделитель)
decimalFormat: ''

# Устаревшая настройка сортировки (лучше использовать sort.yml)
orderBy: ASC # ASC – сначала новые, DESC – сначала старые

# Формат даты в меню (день/месяц/год : час:минута)
dateFormat: "dd/MM/yyyy/HH:mm"

# Формат оставшегося времени (месяц, день, часы, минуты, секунды)
remainingDateFormat: ddd HHh mmm

# ===== Защита от спама пакетами =====
securityForSpammingPacket: true  # Игроки с правом fauction.bypass.spam игнорируются

# ===== Анти-спам для разных действий =====
anti-spam:
  messageCooldown: 2000   # Задержка между предупреждениями (мс)
  logThreshold: 25        # Логировать в консоль, если >25 спам-действий подряд (0 = отключить)
  interact:               # Клики по предметам в меню
    burst: 5              # Можно сделать 8 быстрых кликов подряд
    perSecond: 3          # Затем не более 4 кликов в секунду
  command:                # Команды (/ah, /ah search)
    burst: 4
    perSecond: 2
  transaction:            # Подтверждение покупки, продажа (/ah sell)
    burst: 4
    perSecond: 2

# Действия при покупке (можно выполнить команду после покупки)
onBuy:
  sendCommand: true  # Включить выполнение команды при покупке
  command: 'playsound ENTITY_ITEM_PICKUP player @p ~ ~ ~ 1 1'         # Команда, например: 'say Спасибо за покупку!'

# ===== Таймеры =====
expiration:
  time: 172800        # Время жизни лота (секунды) – 3600 = 1 час
  checkEvery: 36000     # Как часто проверять просроченные лоты (в тиках) – 72000 = 1 час

currencyCheck:
  time: 3600            # Интервал проверки валюты (секунды)
  checkEvery: 72000     # Как часто проверять (в тиках)

cacheUpdate: 600      # Интервал обновления кэша (в тиках) – 1 час

# ===== ОГРАНИЧЕНИЯ ПО ГРУППАМ (ИСПРАВЛЕНО!) =====
# Мы отключаем использование мета-данных LuckPerms и используем встроенный список групп.
limitations-use-meta-luckperms: false

# Список групп и их лимиты (количество предметов, которые можно выставить)
vault-auc:
  groups:
    default: 12
    adventurer: 16
    spellcaster: 22
    magister: 30
    archimage: 40
    lord: 55
    creator: 9999
  priorities:
    default: 1
    adventurer: 2
    spellcaster: 3
    magister: 4
    archimage: 5
    lord: 6
    creator: 9

# Резервный лимит (для игроков, не входящих ни в одну из групп выше)
limitations:
  default: 12

# ===== Глобальные ограничения по цене =====
min-price-default:
  enable: false        # Включить глобальную минимальную цену (за штуку)
  value: 1
max-price-default:
  enable: false        # Включить глобальную максимальную цену (за штуку)
  value: 999999999

# ===== Индивидуальные ограничения для конкретных предметов =====
#min-price:
  #COBBLESTONE: 0.5
#max-price:
  #COBBLESTONE: 5

# ===== Чёрный список предметов =====
item-blacklist: []

# ===== Префикс для сообщений =====
prefix: "&7»"

# ===== Символ валюты и оформление описаний лотов =====
symbol_value:
  money: "⛁"
  item-lore:
    lore:
      - ""
      - "&f&x&F&F&A&5&0&0╔ &fЦена1: &e{price}⛁ &7({pricePerItem} за шт.)"
      - "&f&x&F&F&A&5&0&0╠ &fПродавец: &#74F271{seller}"
      - "&f&x&F&F&A&5&0&0╠ &fИстекает через: &c{daysLeft} дн."
      - "&f&x&F&F&A&5&0&0╚ &fВыставлен: &7{listedDate}"
      - ""
      - "&f&x&F&F&A&5&0&0▸ &x&f&f&c&5&0&0ЛКМ: &fкупить всё &7| &x&f&f&c&5&0&0ПКМ: &fкупить поштучно"
      - ""
  item-lore_one:
    lore:
      - ""
      - "&f&x&F&F&A&5&0&0╔ &fЦена2: &e{price}⛁"
      - "&f&x&F&F&A&5&0&0╠ &fПродавец: &#74F271{seller}"
      - "&f&x&F&F&A&5&0&0╠ &fИстекает через: &c{daysLeft} дн."
      - "&f&x&F&F&A&5&0&0╚ &fВыставлен: &7{listedDate}"
      - ""
      - "&f&x&F&F&A&5&0&0▸ &fНажмите, чтобы &x&f&f&c&5&0&0купить всё"
      - ""
  item-lore_buy_one_item:
    lore:
      - ""
      - "&f&x&F&F&A&5&0&0╔ &fЦена3: &e{total_price}⛁"
      - "&f&x&F&F&A&5&0&0╠ &fПродавец: &#74F271{seller}"
      - "&f&x&F&F&A&5&0&0╚ &fКоличество: &7{amount}"
      - ""
      - "&f&x&F&F&A&5&0&0▸ &fНажмите, чтобы &x&f&f&c&5&0&0приобрести"
      - ""