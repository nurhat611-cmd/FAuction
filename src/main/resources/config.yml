# =====================================================================
# Версия конфигурации. Не меняйте, иначе плагин сбросит настройки.
# =====================================================================
version: 15

# Язык плагина (ru = русский, en, fr, zhcn)
lang: ru

# Валюта, используемая в аукционе:
# VAULT    – деньги с плагина Vault (Essentials и т.п.)
# EXPERIENCE – опыт (уровни)
# LEVEL    – уровни (как опыт, но другое API)
currencyUse: VAULT

# Комиссия аукциона: списывается с продавца при выставлении лота (/ah sell).
# - percent : процент от цены (7.0 == 7%).
# - Права fauction.nocommission.3 / .5 / .7 / .10 / .16 / .25 дают выставить столько лотов
#   БЕЗ комиссии. При нескольких правах берётся максимальное (они НЕ суммируются).
# - free-quota-mode LIFETIME : квота тратится навсегда, счётчик сбрасывает только вайп
#   (/ah clear data players).
# - free-quota-mode ACTIVE : считаются только бесплатные лоты, сейчас висящие на витрине;
#   слот возвращается при продаже/снятии/истечении лота.
commission:
  enabled: true
  percent: 7.0
  free-quota-mode: LIFETIME # LIFETIME или ACTIVE

# Звуки аукциона. Каждый игрок выключает их себе командой /ah sounds off (и включает /ah sounds on).
# - name : ванильный звук (ENTITY_ITEM_PICKUP, UI_BUTTON_CLICK, ...) или кастомный звук
#   ресурспака (custom.cashregister, mypack:ui.click).
# - volume : 1.0 обычная громкость, 0.5 тише, 2.0 слышно дальше.
# - pitch : 1.0 обычный, 0.5 октавой ниже, 2.0 октавой выше.
# Звука НАВЕДЕНИЯ курсора не существует: клиент не сообщает серверу, над каким слотом мышь.
# guiClick покрывает нажатия на кнопки и предметы меню.
sounds:
  sell: # Лот выставлен через /ah sell
    name: "ENTITY_ITEM_PICKUP"
    volume: 2.0
    pitch: 1.0
  expireClaim: # Просроченный предмет забран из /ah expire
    name: "ENTITY_PUFFER_FISH_BLOW_UP"
    volume: 1.0
    pitch: 1.0
  buy: # Покупка завершена (покупатель и онлайн-продавец)
    custom: "custom.cashregister" # Звук из ресурспака, если задан. "" = всегда ванильный звук ниже
    name: "ENTITY_VILLAGER_TRADE"
    volume: 0.5
    pitch: 1.0
  guiClick: # Кнопки и предметы в меню аукциона
    name: "UI_BUTTON_CLICK"
    volume: 0.5
    pitch: 1.0

# Встроенный раздающий сервер ресурспака со звуком кассы (sounds.buy.custom).
# Пак уже внутри jar плагина: сервер поднимает маленький HTTP-сервер на указанном порту
# и сам отправляет пак Java-игрокам при входе. Bedrock-игроки (Geyser/Floodgate) пак не
# получают и слышат ванильную замену (sounds.buy.name).
# - port : свободный порт, который надо открыть/пробросить на хостинге.
# - host : IP или домен, по которому игроки подключаются к серверу (для ссылки на пак).
#   Пусто = взять server-ip из server.properties; если и тот пуст, плагин предупредит в консоли.
# - required : true = не пускать игроков, отклонивших пак.
# - prompt : текст над кнопками при запросе пака (можно пустой). Цвета: & и <MiniMessage>.
resource-pack:
  enabled: true
  port: 8765
  host: ""
  required: false
  prompt: "&6Звуковой пак аукциона (касса при покупке)"

# Меню, которое открывается по команде /ah (по умолчанию AUCTION)
defaultGui: AUCTION

# Названия и алиасы команд.
# ПЕРВОЕ значение списка — основное имя (показывается в /ah help и ошибках), остальные — алиасы.
# - Права при переименовании не меняются: sell под любым именем остаётся fauction.sell.
# - Имя — одно слово без | < > [ ] { } : / \ $ " '
# - Команды регистрируются при старте сервера: правки здесь требуют рестарта, а не reload.
commands:
  root: ["ah", "hdv"]
  list: ["list"]
  search: ["search"]
  sell: ["sell"]
  expire: ["expire"]
  help: ["help"]
  admin: ["admin"]

# ===== Экспериментальные функции =====
feature-flipping:
  item-expiration: true      # Включить автоматическое удаление просроченных лотов
  cache-update: true         # Обновлять кэш данных (для производительности)
  money-format: false        # Красивое форматирование больших чисел (вкл/выкл)
  duplication-hashcode-control: false # Защита от дублирования предметов (хэш-код)

# Формат отображения цен (0.00 = две цифры после запятой)
decimalFormat: "0.00"

update-checker:
  enabled: true # Проверять обновления на GitHub при старте и reload, предупреждать в консоли

# Устаревшая настройка сортировки (лучше использовать sort.yml)
orderBy: "ASC" # ASC – сначала новые, DESC – сначала старые

# Формат даты в меню (день/месяц/год : час:минута)
dateFormat: "dd/MM/yyyy ':' HH:mm"

# Формат оставшегося времени (день, часы, минуты)
remainingDateFormat: "ddd HHh mmm"

# ===== Защита от спама пакетами =====
securityForSpammingPacket: true  # Игроки с правом fauction.bypass.spam игнорируются

# ===== Анти-спам для разных действий =====
anti-spam:
  messageCooldown: 2000   # Задержка между предупреждениями (мс)
  logThreshold: 25        # Логировать в консоль, если >25 спам-действий подряд (0 = отключить)
  interact:               # Клики по предметам в меню
    burst: 5
    perSecond: 3
  command:                # Команды (/ah, /ah search)
    burst: 4
    perSecond: 2
  transaction:            # Подтверждение покупки, продажа (/ah sell)
    burst: 4
    perSecond: 2

# Действия при покупке (можно выполнить команду после покупки).
# Звук покупки теперь встроенный (секция sounds выше), команда для него не нужна.
onBuy:
  sendCommand:
    use: false
    command: ""

# ===== Таймеры =====
expiration:
  time: 172800        # Время жизни лота (секунды) – 172800 = 2 дня
  checkEvery: 36000   # Как часто проверять просроченные лоты (тики) – 36000 = 30 минут
  expiredStorageDays: 3 # Дней предмет лежит в /ah expire, потом удаляется. Права FAuction_expireDay_1..10 каждое добавляет столько дней и суммируются. -1 : не удалять никогда

currencyCheck:
  time: 3600            # Интервал проверки валюты (секунды)
  checkEvery: 72000     # Как часто проверять (тики)

cacheUpdate: 600        # Интервал обновления кэша (тики) – 600 = 30 секунд

# ===== ОГРАНИЧЕНИЯ ПО ГРУППАМ =====
# false = брать лимиты из списка limitations ниже (группа Vault игрока; берётся максимум).
# true  = брать лимит из мета LuckPerms.
limitations-use-meta-luckperms: false

# Лимиты лотов по группам (переведено из бывшего vault-auc — плагин читает именно этот список).
# Поверх этого права FAuction_dubleSlot_1..10 каждое добавляет столько слотов и суммируются.
limitations:
  default: 12
  adventurer: 16
  spellcaster: 22
  magister: 30
  archimage: 40
  lord: 55
  creator: 9999

# ===== Глобальные ограничения по цене =====
min-price-default:
  enable: false        # Включить глобальную минимальную цену (за штуку)
  value: 1
max-price-default:
  enable: false        # Включить глобальную максимальную цену (за штуку)
  value: 999999999

# ===== Индивидуальные ограничения для конкретных предметов =====
# Пример:
#min-price:
#  COBBLESTONE: 0.5
min-price: {}
max-price: {}

# ===== Чёрный список предметов =====
item-blacklist: []
