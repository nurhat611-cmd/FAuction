#=====================================================================
# Версия GUI подтверждения
# =====================================================================
version: 1

gui:
  size: 27                           # Размер 3×9 (27 слотов)
  type: CHEST
  name: "Подтверждение покупки"       # Заголовок окна
  title-true: "&aПодтвердить покупку &f[&r{Item}&r&f]"   # При подтверждении
  title-false: "&cОтменить покупку"                     # При отмене
  hideFlag: false
  description:
    - "&dПродавец: &6{OwnerName}"
    - "&dЦена: &e{Price}⛁"

  auction:
    title: "&eПредмет: &6{ItemName}"
    replaceTitle: false
    description:
      - "&dПродавец: &6{OwnerName}"
      - "&dЦена: &e{Price}⛁"
      - "&dОсталось: &7{RemainingTime}"
      - "&dОписание:"
      - "{lore}"
block:
  '11':
    utility: confirm
    material: RED_WOOL
    value: false
  '13':
    utility: auction
  '15':
    utility: confirm
    material: GREEN_WOOL
    value: true
